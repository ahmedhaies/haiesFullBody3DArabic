name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/3d-anatomy-interactive-system-eb04vt
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-branch concurrency: a push to one branch never cancels another branch's
# run. Only the default branch actually publishes (see the deploy job's `if`),
# so main can build in parallel without cancelling the default branch's deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # GitHub Pages only lets the repository's default branch publish, so only
    # run the publish step there. Other branches still build (verifying the
    # commit) without a failed deploy. Tracks the default branch automatically.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
